[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["tests"]
# Sprint 7.0 (CI #56/#61): `clamav`/`minio`-marked tests each need a
# real, reachable service (dev/staging only, never CI — CI #48/#56's
# own decisions) — excluded from the default run by marker, not
# skipped/disabled; `make test-integration` overrides this with
# `-m "clamav or minio"` to run only them.
markers = [
    "clamav: requires a real ClamAV service, run via `make test-integration` on dev/staging",
    "minio: requires a real MinIO/S3 service, run via `make test-integration` on dev/staging",
]
addopts = "-m 'not clamav and not minio'"

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
