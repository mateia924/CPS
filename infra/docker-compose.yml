# Base service definitions shared by dev and prod. This file is never run
# on its own — always combine it with an environment overlay:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml  ...
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml ...
# (or use the Makefile targets, which do this for you). It intentionally
# ships no source bind-mounts and no published ports on nginx: those are
# environment-specific and live in the overlay files.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ../.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data:Z
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Sprint 5.1 (3.17): S3-compatible object storage for Attachment files.
  # MinIO Inc. stopped publishing to Docker Hub in 2025 — quay.io/minio/minio
  # is the current official distribution; tag pinned per rule 11 (no
  # blind "latest"). Never exposed to the internet (prompt decision 7) —
  # no ports published here in either overlay; the backend/celery_worker
  # reach it over the internal compose network only, and all uploads/
  # downloads go through Django, never directly to MinIO.
  minio:
    image: quay.io/minio/minio:RELEASE.2025-09-07T16-13-09Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    env_file: ../.env
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    volumes:
      - minio_data:/data:Z
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10

  # Sprint 5.1 (3.17 rule 2 "مسح فيروسات عند الرفع"): clamd only, no
  # published ports — celery_worker talks to it over the internal
  # network (INSTREAM protocol) to scan a freshly uploaded file
  # asynchronously. Tag pinned (not `latest`/`stable`, per rule 11).
  # First boot downloads the virus database (~katalog several hundred MB)
  # so the healthcheck's start_period is generous.
  clamav:
    image: clamav/clamav:1.5.4-debian
    restart: unless-stopped
    volumes:
      - clamav_data:/var/lib/clamav:Z
    healthcheck:
      test: ["CMD-SHELL", "clamdcheck.sh || exit 0"]
      interval: 30s
      timeout: 10s
      retries: 10
      start_period: 180s

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    # entrypoint.sh (root, chowns static_data, drops to appuser via gosu)
    # wraps this whole chain — migrate/collectstatic/gunicorn all run as
    # appuser. celery_worker below intentionally does NOT run migrate:
    # only one service should ever run it, to avoid concurrent migration
    # races on container (re)start. ensure_attachments_bucket (5.1) is
    # idempotent — safe to run on every start, creates the bucket only
    # the first time. Sprint 6.6.3 (item 1): migrate/collectstatic/
    # ensure_attachments_bucket all need DDL-level privileges (CREATE
    # POLICY, ALTER TABLE, CREATE INDEX CONCURRENTLY, GRANT) that the
    # restricted `cps_app` role deliberately doesn't have — they keep
    # running as $DATABASE_URL (the unrestricted role); migrate's own
    # 0016_row_level_security already (re-)configures cps_app's
    # grants/policies every time it applies (same underlying function
    # `manage.py setup_rls` exists to let scripts/staging_refresh.sh
    # re-run after a restore, since migrations don't replay against a
    # restored database). Only the final, request-serving gunicorn
    # process switches to $APP_DATABASE_URL, and only where that's
    # actually set (docker-compose.local.yml/staging.yml) — it's unset
    # in the base/dev.yml case, so this falls back to $DATABASE_URL
    # there and nothing changes for those stacks. `$$` (not `$`) on
    # that line, deliberately: it must stay a literal shell variable
    # reference for the CONTAINER's own sh to expand at runtime from
    # its actual environment (below) — a single `$` would instead be
    # swallowed by docker compose's own interpolation at `docker
    # compose up` time, against the *host* shell's env, which has no
    # APP_DATABASE_URL of its own to resolve.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             python manage.py ensure_attachments_bucket &&
             DATABASE_URL=$${APP_DATABASE_URL:-$$DATABASE_URL} exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      # Sprint 6.6.3 (item 1): apps.platform's own DB alias — always
      # the unrestricted role, in every environment, since it needs
      # genuine cross-tenant reads (the whole point of a platform
      # admin) regardless of what "default" is bound to for this
      # process. See config.settings.DATABASES's own comment.
      PLATFORM_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - static_data:/app/staticfiles:Z
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy

  celery_worker:
    build:
      context: ../backend
    restart: unless-stopped
    # Same entrypoint.sh as backend (root -> chown -> gosu appuser), just
    # a different command — no migrate here, see comment on backend above.
    # --beat (sprint 5.1): runs the scheduler in this same process for
    # CELERY_BEAT_SCHEDULE (weekly attachment integrity check) — fine at
    # this project's current scale.
    # Sprint 6.6.3 (item 1): stays on the unrestricted role, unlike
    # backend's own gunicorn step above — Celery tasks are trusted
    # internal background code, often genuinely cross-tenant (the
    # daily approvals digest, weekly attachment integrity check), with
    # no HTTP request/middleware to ever set `cps.tenant_id` in the
    # first place. RLS here would silently return zero rows for every
    # task, not protect anything.
    command: celery -A config worker --beat --loglevel=info
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      PLATFORM_DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      clamav:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_APP_DOMAIN: ${NEXT_PUBLIC_APP_DOMAIN}
    restart: unless-stopped
    # Sprint 6.0.1-B (README debt #13): frontend/src only ever reads
    # NEXT_PUBLIC_* vars (verified: no other process.env.* usage) — it
    # doesn't need DJANGO_SECRET_KEY/POSTGRES_PASSWORD/MinIO secrets
    # that `env_file: ../.env` was handing it. No prod override needed:
    # the production build bakes NEXT_PUBLIC_API_URL in at build time
    # via the ARG above; this only matters for `next dev`.
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
      # Sprint 6.9.1 (item I): the login screen's "اسم شركتك في الرابط"
      # helper text and hostname-based auto-fill both need this — the
      # domain a real subdomain would be a label in front of.
      NEXT_PUBLIC_APP_DOMAIN: ${NEXT_PUBLIC_APP_DOMAIN}
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - static_data:/usr/share/nginx/static:ro,Z
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  static_data:
  minio_data:
  clamav_data:
