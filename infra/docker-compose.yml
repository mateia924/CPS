# Base service definitions shared by dev and prod. This file is never run
# on its own — always combine it with an environment overlay:
#   docker compose -f docker-compose.yml -f docker-compose.dev.yml  ...
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml ...
# (or use the Makefile targets, which do this for you). It intentionally
# ships no source bind-mounts and no published ports on nginx: those are
# environment-specific and live in the overlay files.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ../.env
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    volumes:
      - redis_data:/data:Z
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ../backend
    restart: unless-stopped
    # entrypoint.sh (root, chowns static_data, drops to appuser via gosu)
    # wraps this whole chain — migrate/collectstatic/gunicorn all run as
    # appuser. celery_worker below intentionally does NOT run migrate:
    # only one service should ever run it, to avoid concurrent migration
    # races on container (re)start.
    command: >
      sh -c "python manage.py migrate --noinput &&
             python manage.py collectstatic --noinput &&
             exec gunicorn config.wsgi:application --bind 0.0.0.0:8000 --workers 3"
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - static_data:/app/staticfiles:Z
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  celery_worker:
    build:
      context: ../backend
    restart: unless-stopped
    # Same entrypoint.sh as backend (root -> chown -> gosu appuser), just
    # a different command — no migrate here, see comment on backend above.
    command: celery -A config worker --loglevel=info
    env_file: ../.env
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ../frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    restart: unless-stopped
    env_file: ../.env
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    volumes:
      - static_data:/usr/share/nginx/static:ro,Z
    depends_on:
      - backend
      - frontend

volumes:
  postgres_data:
  redis_data:
  static_data:
