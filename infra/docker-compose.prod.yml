# Production overlay. NOT deployed anywhere yet — this dev host never
# runs this file. Prepared and syntax-checked now (`docker compose
# ... config`) so it's ready to use once a separate production host
# exists and code reaches it via GitHub, per the project's deployment
# decision (dev on this host, prod on a separate host, GitHub in between).
#
# Usage on the future prod host:
#   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
#     --env-file ../.env up -d --build
# or: make prod-up
#
# Needs DOMAIN_NAME and CERTBOT_EMAIL set in .env (see .env.example).
# First-time cert issuance is a manual one-off — see the bootstrap note
# in nginx/nginx.prod.conf.template and README "نشر الإنتاج لاحقًا".

services:
  # Sprint 5.1 (3.17 rule 2): the only signal Django has to refuse
  # booting with ATTACHMENT_SCAN_ENABLED=false — dev's own docker-
  # compose.dev.yml never sets this, so it's unset (falsy) there,
  # matching every other "prod-only" behavior in this project (no env
  # var means dev).
  # Sprint 6.8 (decision 17): the daily pending-approvals digest email
  # (apps.approvals.tasks.send_pending_approvals_digest, celery_worker's
  # beat) — EMAIL_HOST unset means Django's console backend (dev), so
  # this overlay is the only place real SMTP is ever configured. Set
  # EMAIL_HOST/EMAIL_PORT/EMAIL_HOST_USER/EMAIL_HOST_PASSWORD/
  # EMAIL_USE_TLS/DEFAULT_FROM_EMAIL in the prod host's .env — see
  # README "البريد الإلكتروني".
  backend:
    environment:
      CPS_ENVIRONMENT: production
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}

  celery_worker:
    environment:
      CPS_ENVIRONMENT: production
      EMAIL_HOST: ${EMAIL_HOST}
      EMAIL_PORT: ${EMAIL_PORT}
      EMAIL_HOST_USER: ${EMAIL_HOST_USER}
      EMAIL_HOST_PASSWORD: ${EMAIL_HOST_PASSWORD}
      EMAIL_USE_TLS: ${EMAIL_USE_TLS}
      DEFAULT_FROM_EMAIL: ${DEFAULT_FROM_EMAIL}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL}

  nginx:
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.prod.conf.template:/etc/nginx/templates/default.conf.template:ro,Z
      - certbot_conf:/etc/letsencrypt:Z
      - certbot_www:/var/www/certbot:ro,Z
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME}

  certbot:
    image: certbot/certbot:latest
    volumes:
      - certbot_conf:/etc/letsencrypt:Z
      - certbot_www:/var/www/certbot:Z
    # No default command: this service is for one-off / cron-driven runs,
    # not something `up` should start continuously. Example first issuance:
    #   docker compose -f docker-compose.yml -f docker-compose.prod.yml \
    #     --env-file ../.env run --rm certbot certonly --webroot \
    #     -w /var/www/certbot -d ${DOMAIN_NAME} --email ${CERTBOT_EMAIL} \
    #     --agree-tos --no-eff-email
    entrypoint: ["/bin/true"]

volumes:
  certbot_conf:
  certbot_www:
