# Dev overlay. This host is dev-only — see README "Reserved ports on this
# host" before ever changing HTTP_PORT away from 3000.
#
# Usage: docker compose -f docker-compose.yml -f docker-compose.dev.yml \
#          --env-file ../.env up -d --build
# or simply: make dev-up (from the repo root)

services:
  backend:
    volumes:
      - ../backend:/app:Z

  celery_worker:
    volumes:
      - ../backend:/app:Z

  frontend:
    build:
      context: ../frontend
      target: deps
    command: sh -c "npm install && npm run dev"
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
    volumes:
      - ../frontend:/app:Z
      - frontend_node_modules:/app/node_modules

  nginx:
    ports:
      - "${HTTP_PORT:-3000}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro,Z

volumes:
  frontend_node_modules:
