# Sprint 6.6.0: the overlay that serves THIS host's port 3000 going
# forward — no hot-reload, no source bind-mounts, built entirely from
# the image `docker-compose.yml`'s own `backend`/`celery_worker`/
# `frontend` services already produce (no `target: dev`, no `--reload`,
# no `command:` override needed here at all — the base file already
# builds a real image and runs gunicorn without --reload; the OLD
# docker-compose.dev.yml was the one adding bind-mounts+reload on top
# of it). Publishes nginx on 3000, and mounts docs/ (read-only) into
# backend for the same reason docker-compose.dev.yml always has —
# apps.tenants's migrate-backup guard reads docs/ops/backups.log from
# inside the container, and it isn't otherwise reachable from a built
# image whose Dockerfile build context is backend/, not the repo root.
#
# `scripts/deploy.sh` is the ONLY supported way to apply a code change
# here (backup → build → migrate-with-guard → restart → smoke) — never
# `docker compose ... up -d --build` by hand against this file, or the
# backup/smoke discipline gets skipped silently.
#
# Usage (what deploy.sh itself runs):
#   docker compose --env-file ../.env -f docker-compose.yml -f docker-compose.local.yml up -d --build
# Same default project name ("infra") as this host has used all along —
# this is genuinely an in-place cutover of the containers already
# running, not a new/parallel stack.

services:
  backend:
    environment:
      # Sprint 6.6.3 (item 1): the ONLY stack where this is actually
      # set — activates the restricted `cps_app` role for the live,
      # request-serving gunicorn process (docker-compose.yml's own
      # command chain falls back to $DATABASE_URL, the unrestricted
      # role, everywhere else this is unset).
      APP_DATABASE_URL: postgres://${POSTGRES_APP_USER}:${POSTGRES_APP_PASSWORD}@postgres:5432/${POSTGRES_DB}
    volumes:
      - ../docs:/docs:ro,Z

  nginx:
    ports:
      - "${HTTP_PORT:-3000}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro,Z
