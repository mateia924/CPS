name: CI

# Sprint 6.6.3c: CI aligned with make gate — every job below reuses the
# exact same `make <target>` a human runs locally (`make lint`, `make
# test`, `make e2e`), against the exact same docker-compose dev stack
# (project "cps-dev": Postgres + Redis + MinIO + ClamAV + backend), not
# a hand-rolled parallel setup. This is deliberate, not a style
# preference: the previous version of this file ran pytest directly
# against a bare `postgres:16-alpine` service with only three env vars
# set (DJANGO_SECRET_KEY/DJANGO_DEBUG/DATABASE_URL) — missing
# PLATFORM_JWT_SIGNING_KEY (required, crashes at Django settings-import,
# before any test runs) and POSTGRES_APP_USER/PASSWORD (required by
# apps.tenants.services.configure_database_roles_and_rls, crashes at
# the test database's own first migration) entirely on top of that, and
# had no Redis/MinIO/ClamAV at all (every attachment/rate-limiting/
# bank-reconciliation test failed or errored as a result). Reusing the
# Makefile/compose stack means any future service the dev stack gains
# is automatically covered here too, with zero workflow edits.
#
# config/settings.py's own TESTING flag (PYTEST_VERSION env var, which
# pytest itself sets) still gives PLATFORM_JWT_SIGNING_KEY/
# POSTGRES_APP_USER/POSTGRES_APP_PASSWORD safe pytest-only defaults —
# that fix stands on its own (any clean-room pytest run benefits, not
# just this workflow) and is what the single-service version of this
# file would have needed anyway; .env.example's own placeholder values
# (never real secrets) cover everything else make test/lint/e2e need.

on:
  push:

jobs:
  backend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Prepare .env (dev-only placeholder secrets, never real ones)
        run: cp .env.example .env

      - name: Bring up the dev stack (same project make dev-up/test/lint use)
        run: |
          set -o pipefail
          make dev-up 2>&1 | tee dev-up.log
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 40 dev-up.log | while IFS= read -r l; do echo "::error::$l"; done
            exit "$status"
          fi

      - name: Lint (ruff) — same gate as `make lint`
        run: |
          set -o pipefail
          make lint 2>&1 | tee lint.log
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 40 lint.log | while IFS= read -r l; do echo "::error::$l"; done
            exit "$status"
          fi

      # First boot downloads ClamAV's virus DB (several hundred MB) —
      # see infra/docker-compose.yml's own healthcheck start_period.
      - name: Wait for ClamAV to be ready
        run: |
          for _ in $(seq 1 60); do
            STATUS="$(docker inspect -f '{{.State.Health.Status}}' cps-dev-clamav-1 2>/dev/null || echo starting)"
            if [ "$STATUS" = "healthy" ]; then
              echo "clamav is healthy"
              exit 0
            fi
            sleep 10
          done
          echo "clamav never became healthy within 600s" >&2
          exit 1

      # Sprint 6.6.5 (CI #46 investigation): a `make` failure's own
      # last lines, re-printed as `::error::` annotations — readable
      # straight off the run's summary page, no login/log-scrolling
      # needed. `set -o pipefail` is required — without it, `$?` right
      # after a `| tee` pipeline is `tee`'s own exit code (always 0),
      # not `make`'s, and this would never trigger.
      - name: Tests (pytest) — same gate as `make test`
        run: |
          set -o pipefail
          make test 2>&1 | tee test.log
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 40 test.log | while IFS= read -r l; do echo "::error::$l"; done
            exit "$status"
          fi

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000/api
        run: npm run build

  e2e:
    # Sprint 6.6.3c (item 4): its own job — a real headless-browser
    # click-through (scripts/e2e.sh/make e2e) is slower and heavier
    # than the other two jobs and was never run in CI at all before
    # this sprint; gating it on both of them passing first means a
    # plain lint/type error fails fast without waiting for it.
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      - name: Prepare .env (dev-only placeholder secrets, never real ones)
        run: |
          cp .env.example .env
          # scripts/e2e.sh reads DEV_NEXT_PUBLIC_API_URL straight out of
          # .env to find the stack it should target — .env.example's own
          # value points at this dev host's real public IP, meaningless
          # on a GitHub-hosted runner.
          sed -i 's#^DEV_NEXT_PUBLIC_API_URL=.*#DEV_NEXT_PUBLIC_API_URL=http://localhost:3002/api#' .env

      - name: Bring up the dev stack
        run: |
          set -o pipefail
          make dev-up 2>&1 | tee dev-up.log
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 40 dev-up.log | while IFS= read -r l; do echo "::error::$l"; done
            exit "$status"
          fi

      - name: Wait for the backend to actually accept connections
        # Sprint 6.6.0's own scripts/deploy.sh polls the exact same way
        # for the exact same reason: nginx accepts connections well
        # before gunicorn finishes migrate/collectstatic/
        # ensure_attachments_bucket and actually binds — a fixed sleep
        # either races that window or wastes CI time padding for it.
        run: |
          for _ in $(seq 1 60); do
            STATUS="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3002/admin/login/ || true)"
            if [ "$STATUS" != "502" ] && [ "$STATUS" != "503" ] && [ "$STATUS" != "000" ]; then
              echo "backend is up (status $STATUS)"
              exit 0
            fi
            sleep 2
          done
          echo "backend never accepted a connection within 120s" >&2
          exit 1

      - name: E2E (Playwright) — same gate as `make e2e`
        run: |
          set -o pipefail
          make e2e 2>&1 | tee e2e.log
          status=$?
          if [ "$status" -ne 0 ]; then
            tail -n 40 e2e.log | while IFS= read -r l; do echo "::error::$l"; done
            exit "$status"
          fi
