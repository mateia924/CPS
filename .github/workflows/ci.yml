name: CI

# Sprint 6.6.5 (CI #46, 6.6.3e): the backend job runs the gate
# NATIVELY on the runner — no docker-compose, no .env, no image build
# at all — via Makefile's `RUN=` override (see Makefile's own comment
# on `RUN`/`test`/`lint`). CI #46 (backend ❌ in 9s, exit 2) traced
# back to the previous version of this job, which — like every other
# `make` target — unconditionally went through `docker compose -p
# cps-dev ... up -d --build`/`exec`: real `.env` + a from-scratch
# image build is neither available nor wanted on a GitHub-hosted
# runner the way it is on this project's own long-lived dev host.
# "The checks are ONE; the dev sandbox runs them inside the
# already-built `cps-dev` backend container, CI runs them natively on
# the runner via Makefile's RUN." (see README)
#
# The frontend job was never part of #46 and is unchanged. The e2e job
# stays on docker-compose (closest to a real deployment, and Playwright
# needs the full stack serving real HTTP) — its own `.env.ci` (committed,
# non-secret test values) replaces `.env.example` + a sed patch.

on:
  push:

jobs:
  backend:
    runs-on: ubuntu-24.04
    env:
      RUN: ""
      CPS_ENVIRONMENT: ci
      DJANGO_SECRET_KEY: ci-test-django-secret-key-never-used-outside-github-actions
      # CI #56: required with no safe default outside TESTING
      # (config/settings.py) — TESTING is PYTEST_VERSION-gated, so it
      # covers `make test` but didn't cover this job's own now-removed
      # `ensure_attachments_bucket` step (a bare `manage.py` invocation,
      # never under pytest) back when that step still existed. The
      # "Verify required CI env vars" step below exists so the NEXT
      # variable like this one fails fast with its own name, not a
      # 40-second-deep traceback.
      PLATFORM_JWT_SIGNING_KEY: ci-test-platform-jwt-signing-key-never-used-outside-github-actions
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/cps
      REDIS_URL: redis://localhost:6379/0
      # CI #56/#61: no MinIO service at all — "Start MinIO" failed
      # Docker-CLI-level (exit 125, a quay.io pull/registry failure,
      # never our own health-check timeout) on every single run since
      # the native rewrite (770c9bd through #61, 13 consecutive runs
      # over 2+ days) — not fixable from this side, same class of
      # fragile third-party-registry dependency CI #48 already removed
      # ClamAV for. apps.attachments.storage.attachment_storage() picks
      # a local FileSystemStorage when ATTACHMENT_STORAGE_BACKEND=local
      # — every attachment test goes through Django's ordinary File API
      # regardless, so nothing here is weakened; the real S3/MinIO
      # round trip is proven separately by the `minio`-marked test, run
      # via `make test-integration` on dev/staging (docs/ops/DEPLOY.md).
      ATTACHMENT_STORAGE_BACKEND: local
      # CI #48 investigation: no ClamAV service at all — downloading
      # its virus DB doesn't suit a CI runner (the old compose-based
      # job's own 600s wait step for this was already a tell). Reuses
      # the EXISTING, already-correct escape hatch (apps.attachments.
      # tasks.scan_attachment: ATTACHMENT_SCAN_ENABLED=false marks
      # every upload SKIPPED instead of calling clamd at all — refused
      # only in production, config/settings.py) rather than inventing
      # a parallel flag — no application code changed for this.
      ATTACHMENT_SCAN_ENABLED: "false"
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: cps
        ports: ["5432:5432"]
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=5s --health-timeout=5s --health-retries=10
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd="redis-cli ping"
          --health-interval=5s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v6

      # CI #56: PLATFORM_JWT_SIGNING_KEY was silently missing from this
      # job's own `env:` block above for a long time — the only visible
      # symptom was a 40-second-deep Django traceback from whichever
      # step happened to import settings first. A missing required var
      # now fails here instead, in under a second, naming exactly which
      # one — before spending any time on setup-python/pip/MinIO.
      - name: Verify required CI env vars are set
        run: |
          missing=""
          for VAR in DJANGO_SECRET_KEY PLATFORM_JWT_SIGNING_KEY DATABASE_URL REDIS_URL ATTACHMENT_STORAGE_BACKEND; do
            if [ -z "${!VAR}" ]; then
              missing="$missing $VAR"
            fi
          done
          if [ -n "$missing" ]; then
            echo "::error::Required CI env var(s) not set (add to this job's own env: block in .github/workflows/ci.yml):$missing"
            exit 1
          fi
          echo "All required CI env vars are present."

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      # python-magic (requirements.txt) dlopen's libmagic.so at import
      # time — backend/Dockerfile apt-get installs it for exactly this
      # reason. ubuntu-24.04 runners likely already carry it (`file`,
      # a base-image staple, depends on it) but this costs nothing and
      # removes the uncertainty outright rather than hoping.
      - name: Install system dependencies (libmagic, for python-magic)
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends libmagic1

      - name: Install dependencies (requirements-dev.txt already pulls in requirements.txt)
        run: pip install -r backend/requirements-dev.txt

      - name: Lint (ruff) — same gate as `make lint`
        shell: bash
        run: |
          set +e
          make lint 2>&1 | tee lint.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            tail -n 40 lint.log | while IFS= read -r l; do echo "::error::$l"; done
            exit "$status"
          fi

      # CI coverage (2026-10-20): every test file under backend/ must be
      # collected by exactly one pytest step below. From 2026-10-04 the
      # steps listed files by name and 24 new files were never collected
      # while CI stayed green (docs/reports/2026-10-20-ci-coverage.md).
      - name: CI coverage guard — every test file is collected exactly once
        shell: bash
        run: scripts/check_ci_collection.sh

      # CI #56/#61: MinIO removed from this job entirely (see the
      # ATTACHMENT_STORAGE_BACKEND note in this job's own env: block
      # above) — no service to start, no bucket to prepare. The old
      # "Start MinIO"/"Prepare the attachments bucket" steps lived here.

      # CI #62/#63 investigation: "Tests (pytest)" has failed twice with
      # exit code 2 (pytest's own EXIT_INTERRUPTED) 5-6 minutes into the
      # run — not an import/collection crash (collect-only takes under
      # 2s locally) and not reproducible in two separate, faithful local
      # clones of this exact job (both passed clean, 673/673). No
      # pytest-xdist in play (no -n flag, not even installed), so a
      # worker-OOM story doesn't apply either. Until the real cause is
      # found, this job diagnoses itself instead of guessing: resource
      # numbers printed up front, and the single pytest run split into
      # four domain-named steps so the FAILING STEP'S NAME ALONE narrows
      # which third of the suite was running when it happened — readable
      # from the run summary with no log access at all.
      - name: Resource check (nproc / free -m) — CI #62/#63 investigation
        run: |
          echo "nproc: $(nproc)"
          free -m

      # CI #66 investigation: tail -n 80 was the wrong shape for GitHub's
      # own annotation surface — it keeps the FIRST ~10 ::error:: calls
      # a step makes, not the last, so 80 lines of mostly-PASSED output
      # drowned out the one line that actually mattered. Now: one
      # multi-line annotation per step (::error::'s own %0A-encoding),
      # built from pytest's OWN "short test summary info" section (-ra)
      # plus a short --tb=short traceback — picked by SECTION, not a
      # blind tail, so a handful of PASSED lines can never crowd out the
      # actual failure again.
      #
      # continue-on-error: true on all four groups — a single run now
      # maps every group's real status instead of stopping at the first
      # failure (four ~10-minute runs to see the whole picture). This
      # makes a step LOOK green in the UI regardless of its real result,
      # which is exactly why the "Gate" step below exists and is what
      # actually protects the branch — `outcome` (pre-override) decides
      # it, not `conclusion`.
      - name: Tests (pytest) — accounting
        id: test_accounting
        shell: bash
        continue-on-error: true
        run: |
          set +e
          source scripts/ci_test_groups.sh && cd backend/tests && pytest -v -ra --tb=short --create-db $CI_GROUP_ACCOUNTING 2>&1 | tee /tmp/test-accounting.log
          status=${PIPESTATUS[0]}
          # 2026-10-20 (CI coverage): the executed count, readable from the
          # check-run annotations API without access to the raw logs.
          echo "::notice title=pytest counts accounting::$(tail -n 1 /tmp/test-accounting.log)"
          skipped=$(grep '^SKIPPED' /tmp/test-accounting.log | head -n 60 | python3 -c "import sys; print(sys.stdin.read().replace(chr(10),'%0A'))")
          [ -z "$skipped" ] || echo "::notice title=pytest skipped accounting (first 60 lines only)::$skipped"
          deselected=$(grep '^DESELECTED' /tmp/test-accounting.log | head -n 60 | python3 -c "import sys; print(sys.stdin.read().replace(chr(10),'%0A'))")
          [ -z "$deselected" ] || echo "::notice title=pytest deselected accounting (first 60 lines only)::$deselected"
          set -e
          if [ "$status" -ne 0 ]; then
            { echo "=== short test summary ==="; sed -n '/short test summary info/,$p' /tmp/test-accounting.log | head -n 40; echo "=== tail ==="; tail -n 40 /tmp/test-accounting.log; } > /tmp/ann-accounting.txt
            msg=$(python3 -c "print(open('/tmp/ann-accounting.txt').read()[:3000].replace(chr(13),'').replace(chr(10),'%0A'))")
            echo "::error title=pytest accounting failed::$msg"
            exit "$status"
          fi

      - name: Tests (pytest) — assets and treasury
        id: test_assets_treasury
        shell: bash
        continue-on-error: true
        run: |
          set +e
          source scripts/ci_test_groups.sh && cd backend/tests && pytest -v -ra --tb=short $CI_GROUP_ASSETS_TREASURY 2>&1 | tee /tmp/test-assets-treasury.log
          status=${PIPESTATUS[0]}
          # 2026-10-20 (CI coverage): the executed count, readable from the
          # check-run annotations API without access to the raw logs.
          echo "::notice title=pytest counts assets-treasury::$(tail -n 1 /tmp/test-assets-treasury.log)"
          skipped=$(grep '^SKIPPED' /tmp/test-assets-treasury.log | head -n 60 | python3 -c "import sys; print(sys.stdin.read().replace(chr(10),'%0A'))")
          [ -z "$skipped" ] || echo "::notice title=pytest skipped assets-treasury (first 60 lines only)::$skipped"
          deselected=$(grep '^DESELECTED' /tmp/test-assets-treasury.log | head -n 60 | python3 -c "import sys; print(sys.stdin.read().replace(chr(10),'%0A'))")
          [ -z "$deselected" ] || echo "::notice title=pytest deselected assets-treasury (first 60 lines only)::$deselected"
          set -e
          if [ "$status" -ne 0 ]; then
            { echo "=== short test summary ==="; sed -n '/short test summary info/,$p' /tmp/test-assets-treasury.log | head -n 40; echo "=== tail ==="; tail -n 40 /tmp/test-assets-treasury.log; } > /tmp/ann-assets-treasury.txt
            msg=$(python3 -c "print(open('/tmp/ann-assets-treasury.txt').read()[:3000].replace(chr(13),'').replace(chr(10),'%0A'))")
            echo "::error title=pytest assets-and-treasury failed::$msg"
            exit "$status"
          fi

      - name: Tests (pytest) — attachments and permissions
        id: test_attachments_permissions
        shell: bash
        continue-on-error: true
        run: |
          set +e
          source scripts/ci_test_groups.sh && cd backend/tests && pytest -v -ra --tb=short $CI_GROUP_ATTACHMENTS_PERMISSIONS 2>&1 | tee /tmp/test-attachments-permissions.log
          status=${PIPESTATUS[0]}
          # 2026-10-20 (CI coverage): the executed count, readable from the
          # check-run annotations API without access to the raw logs.
          echo "::notice title=pytest counts attachments-permissions::$(tail -n 1 /tmp/test-attachments-permissions.log)"
          skipped=$(grep '^SKIPPED' /tmp/test-attachments-permissions.log | head -n 60 | python3 -c "import sys; print(sys.stdin.read().replace(chr(10),'%0A'))")
          [ -z "$skipped" ] || echo "::notice title=pytest skipped attachments-permissions (first 60 lines only)::$skipped"
          deselected=$(grep '^DESELECTED' /tmp/test-attachments-permissions.log | head -n 60 | python3 -c "import sys; print(sys.stdin.read().replace(chr(10),'%0A'))")
          [ -z "$deselected" ] || echo "::notice title=pytest deselected attachments-permissions (first 60 lines only)::$deselected"
          set -e
          if [ "$status" -ne 0 ]; then
            { echo "=== short test summary ==="; sed -n '/short test summary info/,$p' /tmp/test-attachments-permissions.log | head -n 40; echo "=== tail ==="; tail -n 40 /tmp/test-attachments-permissions.log; } > /tmp/ann-attachments-permissions.txt
            msg=$(python3 -c "print(open('/tmp/ann-attachments-permissions.txt').read()[:3000].replace(chr(13),'').replace(chr(10),'%0A'))")
            echo "::error title=pytest attachments-and-permissions failed::$msg"
            exit "$status"
          fi

      - name: Tests (pytest) — the rest (every other file under backend/tests)
        id: test_rest
        shell: bash
        continue-on-error: true
        run: |
          set +e
          source scripts/ci_test_groups.sh && cd backend/tests && pytest -v -ra --tb=short $(ci_group_rest_args) 2>&1 | tee /tmp/test-rest.log
          status=${PIPESTATUS[0]}
          # 2026-10-20 (CI coverage): the executed count, readable from the
          # check-run annotations API without access to the raw logs.
          echo "::notice title=pytest counts rest::$(tail -n 1 /tmp/test-rest.log)"
          skipped=$(grep '^SKIPPED' /tmp/test-rest.log | head -n 60 | python3 -c "import sys; print(sys.stdin.read().replace(chr(10),'%0A'))")
          [ -z "$skipped" ] || echo "::notice title=pytest skipped rest (first 60 lines only)::$skipped"
          deselected=$(grep '^DESELECTED' /tmp/test-rest.log | head -n 60 | python3 -c "import sys; print(sys.stdin.read().replace(chr(10),'%0A'))")
          [ -z "$deselected" ] || echo "::notice title=pytest deselected rest (first 60 lines only)::$deselected"
          set -e
          if [ "$status" -ne 0 ]; then
            { echo "=== short test summary ==="; sed -n '/short test summary info/,$p' /tmp/test-rest.log | head -n 40; echo "=== tail ==="; tail -n 40 /tmp/test-rest.log; } > /tmp/ann-rest.txt
            msg=$(python3 -c "print(open('/tmp/ann-rest.txt').read()[:3000].replace(chr(13),'').replace(chr(10),'%0A'))")
            echo "::error title=pytest the-rest failed::$msg"
            exit "$status"
          fi

      # The actual branch protection: continue-on-error above means
      # each step's own `conclusion` reads "success" regardless of its
      # real result — `outcome` is the pre-override truth. if: always()
      # so this runs even after an earlier group's own (overridden)
      # "failure", and so every group gets a chance to run before this
      # decides the job's real result.
      - name: Gate — fail the job if any pytest group actually failed
        if: always()
        run: |
          failed=""
          [ "${{ steps.test_accounting.outcome }}" != "success" ] && failed="$failed accounting"
          [ "${{ steps.test_assets_treasury.outcome }}" != "success" ] && failed="$failed assets-and-treasury"
          [ "${{ steps.test_attachments_permissions.outcome }}" != "success" ] && failed="$failed attachments-and-permissions"
          [ "${{ steps.test_rest.outcome }}" != "success" ] && failed="$failed the-rest"
          if [ -n "$failed" ]; then
            echo "::error::Pytest group(s) failed:$failed — see each group's own annotation above."
            exit 1
          fi
          echo "All four pytest groups passed."
          # CI coverage (2026-10-20) and block 8.2.1: skipped and deselected
          # tests do not run; each step's counts may not rise above their
          # ceilings in scripts/ci_test_groups.sh.
          scripts/ci_gate_counts.sh /tmp

  frontend:
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      # Block 8.2.1: `next lint` was removed in Next 16, so lint had never
      # run. eslint now runs on every push; the 2026-10-20 backlog (44
      # errors, 26 warnings) is recorded in frontend/lint-baseline.json and
      # anything above it fails the job.
      - name: Lint (eslint) — nothing above frontend/lint-baseline.json
        run: npm run lint:baseline

      # Block 8.2.1: every e2e spec file is run by exactly one runner.
      - name: E2E spec coverage — every spec under frontend/e2e is run
        working-directory: .
        run: scripts/check_e2e_runners.sh

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3000/api
        run: npm run build

  e2e:
    # Sprint 6.6.3c (item 4): its own job — a real headless-browser
    # click-through (scripts/e2e.sh/make e2e) is slower and heavier
    # than the other two jobs and was never run in CI at all before
    # this sprint; gating it on both of them passing first means a
    # plain lint/type error fails fast without waiting for it.
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6

      # Sprint 6.6.5 (6.6.3e): .env.ci (committed, non-secret test
      # values, already pointed at localhost:3002 — no sed patch
      # needed) replaces .env.example here specifically.
      - name: Prepare .env (the e2e job's own committed test env file)
        run: cp .env.ci .env

      # CI #61: CI_OVERLAY=1 layers on infra/docker-compose.ci.yml
      # (removes the minio service entirely — see that file's own
      # header) — a real dev box's own `make dev-up` (no CI_OVERLAY)
      # is completely unaffected.
      - name: Bring up the dev stack
        shell: bash
        run: |
          set +e
          make dev-up CI_OVERLAY=1 2>&1 | tee dev-up.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            tail -n 40 dev-up.log | while IFS= read -r l; do echo "::error::$l"; done
            exit "$status"
          fi

      - name: Wait for the backend to actually accept connections
        # Sprint 6.6.0's own scripts/deploy.sh polls the exact same way
        # for the exact same reason: nginx accepts connections well
        # before gunicorn finishes migrate/collectstatic/
        # ensure_attachments_bucket and actually binds — a fixed sleep
        # either races that window or wastes CI time padding for it.
        run: |
          for _ in $(seq 1 60); do
            STATUS="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:3002/admin/login/ || true)"
            if [ "$STATUS" != "502" ] && [ "$STATUS" != "503" ] && [ "$STATUS" != "000" ]; then
              echo "backend is up (status $STATUS)"
              exit 0
            fi
            sleep 2
          done
          echo "backend never accepted a connection within 120s" >&2
          exit 1

      # 2026-10-04 (CI #78 investigation, docs/ops/e2e_reliability.log):
      # a blind `tail -n 40` as individual ::error:: lines was the same
      # shape the backend job had already been burned by (CI #66, see
      # that job's own comment above) — e2e.sh runs 9 separate
      # `docker run` phases plus two archive_smoke_tenants calls, so 40
      # lines can land anywhere: a later Playwright Docker image pull,
      # an unrelated phase marker, or nothing useful at all. The public
      # GitHub API also refuses to download a job's raw logs without
      # admin rights on this repo, so this annotation IS the only
      # diagnosis a human reviewing the run from outside gets — same
      # reasoning as the backend job's own switch to a built, targeted
      # annotation. Extracts: which "[e2e] phase N: ..." marker was the
      # last one printed (so a shell-level failure before any Playwright
      # test even a phase number can be located against), Playwright's
      # own numbered failure block ("N) [browser] › spec.ts:LINE:COL ›
      # test name" through its error message — the exact shape
      # --reporter=list prints a failure in), and a plain tail as a
      # catch-all for a failure that matches neither (a docker pull
      # error, a non-Playwright shell command failing).
      - name: E2E (Playwright) — same gate as `make e2e`
        shell: bash
        run: |
          set +e
          make e2e 2>&1 | tee e2e.log
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -ne 0 ]; then
            {
              echo "=== last [e2e] phase marker reached before failure ==="
              grep -n '^\[e2e\]' e2e.log | tail -n 1
              echo "=== Playwright's own failure block (if any) ==="
              awk '/^[[:space:]]*[0-9]+\)[[:space:]]*\[/{capture=1} capture{print}' e2e.log | tail -n 60
              echo "=== tail ==="
              tail -n 40 e2e.log
            } > /tmp/ann-e2e.txt
            msg=$(python3 -c "print(open('/tmp/ann-e2e.txt').read()[:3000].replace(chr(13),'').replace(chr(10),'%0A'))")
            echo "::error title=e2e (Playwright) failed::$msg"
            exit "$status"
          fi
